name: Build Native Module

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd native
          npm install
      
      - name: Build Native Module
        run: |
          cd native
          npx node-gyp configure
          npx node-gyp build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-memory-windows
          path: native/build/Release/secure_memory.node
          retention-days: 30
